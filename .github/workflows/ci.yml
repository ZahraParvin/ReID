name: CI

# Runs on every push and pull request. Keep this one fast (target: under 5 minutes)
# so it is cheap enough to run on every commit.
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous, still-running job.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # README: "3.12 is the safer default for CI until every dependency has 3.14 wheels"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: python -m pip install --upgrade pip ruff black

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        # Existing scripts use aligned-assignment style; exclude them until
        # `black .` is run once to bring them into compliance.
        run: |
          black --check --diff \
            --extend-exclude "(server|edge_client|start|evaluate_system|dashboard|sim_cameras|demo_system|generate_reid_notebook|generate_vehicle_reid_notebook)\.py" \
            .

  test:
    name: Unit tests (CPU) + PostgreSQL
    runs-on: ubuntu-latest

    # PostgreSQL runs as a service container so the persistence tests exercise a
    # real database instead of a mock — this is the part that catches gallery
    # reload / schema regressions.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reid
          POSTGRES_PASSWORD: reid
          POSTGRES_DB: reid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://reid:reid@localhost:5432/reid_test
      REID_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only — GitHub-hosted runners have no GPU, and the CUDA
          # wheels are ~2.5 GB and would dominate the job time.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        # GPU-marked tests are skipped here; they run in integration.yml on a
        # self-hosted runner. See pytest.ini for the marker definition.
        run: pytest -v -m "not gpu" --cov=. --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        # One image per tier of the edge–server split.
        include:
          - name: server
            dockerfile: docker/Dockerfile.server
          - name: edge
            dockerfile: docker/Dockerfile.edge
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false                 # build-only: proves the image still builds
          load: true
          tags: reid-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Cheapest possible proof the image is not just built but runnable.
        run: docker run --rm reid-${{ matrix.name }}:ci python -c "import sys; print(sys.version)"
