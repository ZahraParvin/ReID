name: Integration suite

# Manual until a provisioned GPU runner and a verified baseline are available.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reid
          POSTGRES_PASSWORD: reid
          POSTGRES_DB: reid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reid -d reid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://reid:reid@localhost:5432/reid_test
      REID_ASSETS_DIR: ${{ vars.REID_ASSETS_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check GPU and provisioned assets
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          test -n "$REID_ASSETS_DIR"
          for file in sim_cam1.mp4 sim_cam2.mp4 sim_cam3.mp4 vehicle_reid_osnet_v4.pth; do
            test -s "$REID_ASSETS_DIR/$file"
            cp "$REID_ASSETS_DIR/$file" .
          done
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Require CUDA-enabled PyTorch
        run: python -c "import torch; assert torch.cuda.is_available(), 'CUDA unavailable to PyTorch'"
      - name: Start services and wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          python server.py > server.log 2>&1 &
          echo $! > server.pid
          streamlit run dashboard.py --server.headless true > dashboard.log 2>&1 &
          echo $! > dashboard.pid
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5005/stats && curl -fsS http://localhost:8501/_stcore/health; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
      - name: Run complete evaluation
        run: python evaluate_system.py --strict --report report.txt
      - name: Check all regression gates
        run: python regression.py report.txt
      - name: Stop services
        if: always()
        shell: bash
        run: |
          for file in server.pid dashboard.pid; do
            if [ -f "$file" ]; then kill "$(cat "$file")" || true; fi
          done
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            report.txt
            server.log
            dashboard.log
          if-no-files-found: warn
